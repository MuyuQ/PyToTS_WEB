version: 2
updates:
  # 依赖老化（Astro 4 EOL 才被发现）的治本手段：每周自动开版本更新 PR
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
